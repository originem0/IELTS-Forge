name: Build full offline packages

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  browser-tests:
    name: Verify real browser and local storage
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          cache-dependency-path: launcher/go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install existing browser-test tooling
        shell: pwsh
        run: |
          npm install --prefix "$env:RUNNER_TEMP/elp-browser" --no-save --ignore-scripts --no-audit --no-fund playwright@1.58.2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:RUNNER_TEMP/elp-browser/node_modules/.bin/playwright.cmd" install chromium
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run mandatory browser regressions
        shell: pwsh
        run: |
          $env:ELP_BROWSER_TEST='1'
          $env:ELP_BROWSER_CHANNEL='bundled'
          $env:ELP_PLAYWRIGHT_MODULE="$env:RUNNER_TEMP/elp-browser/node_modules/playwright"
          go -C launcher test ./... -count=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($test in @('ui-smoke.cjs','markdown-review.cjs','correction-notebook.cjs')) {
            node "tests/$test"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Save browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-diagnostics
          path: dist-test/
          if-no-files-found: ignore
  build:
    needs: browser-tests
    # build-whisper.ps1 uses the Visual Studio 17 2022 generator.
    # windows-latest can migrate to a newer VS major without that toolchain.
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          cache-dependency-path: launcher/go.mod

      - name: Check static app
        shell: pwsh
        run: |
          node scripts/check.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Check launcher
        shell: pwsh
        run: |
          Get-ChildItem launcher -Filter *.go | ForEach-Object { gofmt -w $_.FullName }
          git diff --exit-code
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Push-Location launcher
          go test ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go vet ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location

      - name: Build portable package
        shell: pwsh
        run: |
          $version = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}" } else { "${{ github.sha }}".Substring(0, 7) }
          ./build-portable.ps1 -Version $version

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: EnglishLearnPath-Windows-x64-Full
          path: dist/*.zip
          if-no-files-found: error

  publish:
    name: Publish verified Windows package
    if: github.ref_type == 'tag'
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release notes
        uses: actions/checkout@v4
      - name: Download verified Windows package
        uses: actions/download-artifact@v4
        with:
          name: EnglishLearnPath-Windows-x64-Full
          path: release-assets/windows
      - name: Publish verified package
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          windows_zip="$(find release-assets/windows -maxdepth 1 -name 'EnglishLearnPath-Windows-x64-Full-*.zip' -print -quit)"
          test -n "$windows_zip"
          gh release create "$GITHUB_REF_NAME" "$windows_zip" --title "English Learning Path $GITHUB_REF_NAME · Windows 完整离线包" --notes-file docs/RELEASE_NOTES.md
